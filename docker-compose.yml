services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: job_portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: job_portal
      DB_USER: portal
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      DB_SSL_MODE: DISABLED
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
      DDL_AUTO: update
      UPLOAD_DIR: /var/data/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_SAMPLE_JOBS: "true"
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    volumes:
      - resume_data:/var/data/uploads

volumes:
  mysql_data:
  resume_data: